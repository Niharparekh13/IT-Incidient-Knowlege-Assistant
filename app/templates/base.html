<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}IT Incident Knowledge Assistant{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header class="app-header">
        <a class="brand" href="{{ url_for('main.index') }}">
            <span class="brand-mark">IT</span>
            <span>Incident Knowledge Assistant</span>
        </a>
        <nav aria-label="Primary navigation">
            <a href="{{ url_for('main.index') }}">Search Issue</a>
            <a href="{{ url_for('main.knowledge') }}">Knowledge Base</a>
            <a href="{{ url_for('main.incidents') }}">Incident Queue</a>
            <a href="{{ url_for('main.ai_dashboard') }}">AI Activity</a>
            <a class="nav-action" href="{{ url_for('main.new_incident') }}">New Incident</a>
        </nav>
    </header>

    <main class="shell">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <section class="flash-list" aria-label="Messages">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </section>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
